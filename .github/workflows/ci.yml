name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sintaxe Python (servidor, setup, slides)
        run: python -m py_compile servidor.py setup.py gerar-slides.py

      - name: Smoke test — servidor sobe e responde
        run: |
          python servidor.py 8124 > /tmp/servidor.log 2>&1 &
          SRV=$!
          sleep 2
          curl -fsS -o /dev/null http://localhost:8124/
          curl -fsS http://localhost:8124/api/config
          kill $SRV

      - name: Sintaxe JavaScript (curso, exercícios, provas, QR Code)
        run: node --check curso.js && node --check exercicios.js && node --check provas.js && node --check qrcode.js
