name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sintaxe Python (servidor, setup, slides, teste de permissões)
        run: python -m py_compile servidor.py setup.py gerar-slides.py teste-permissoes.py

      - name: Smoke test — servidor sobe e responde
        run: |
          python servidor.py 8124 > /tmp/servidor.log 2>&1 &
          SRV=$!
          # aguarda o servidor aceitar conexões (primeira execução cria o banco)
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8124/ 2>/dev/null; then
              break
            fi
            if ! kill -0 $SRV 2>/dev/null; then
              echo "servidor encerrou prematuramente"; cat /tmp/servidor.log; exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8124/api/config
          kill $SRV

      - name: Teste de permissões por papel (secretaria vs instrutor)
        run: python teste-permissoes.py

      - name: Resumo de exercícios — médias separadas dos apêndices (get_exercicios)
        run: python teste-resumo-apendices.py

      - name: Sintaxe JavaScript (curso, exercícios, provas, QR Code)
        run: node --check curso.js && node --check exercicios.js && node --check provas.js && node --check qrcode.js

      - name: Trava do modo quiosque (lógica real do index.html)
        run: node teste-trava-quiosque.js

      - name: Badge quiosque na lista de alunos (render real do alunos.html)
        run: node teste-badge-quiosque.js

      - name: Badge quiosque na lista de alunos (render real do secretaria.html)
        run: node teste-badge-secretaria.js

      - name: Quiz dos apêndices A e B (render real do apendice-exercicios.html)
        run: node teste-apendice-exercicios.js

      - name: Selo de pendências dos apêndices (render real de alunos.html e secretaria.html)
        run: node teste-selo-apendices.js

      - name: Boletim impresso com apêndices (render real do boletimAluno)
        run: node teste-boletim-apendices.js

      - name: Nota de Exercícios inclui média dos apêndices (render real do alunos.html)
        run: node teste-nota-apendices.js
      - name: Resumo da ficha mostra aproveitamento dos apêndices (render real de alunos.html e secretaria.html)
        run: node teste-resumo-apendices.js

      - name: Aulas extras dos apêndices no plano de aulas (render real do plano-de-aulas.html)
        run: node teste-plano-apendices.js
