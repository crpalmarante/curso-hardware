name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sintaxe Python (servidor, setup, slides, teste de permissões)
        run: python -m py_compile servidor.py setup.py gerar-slides.py teste-permissoes.py

      - name: Smoke test — servidor sobe e responde
        run: |
          python servidor.py 8124 > /tmp/servidor.log 2>&1 &
          SRV=$!
          # aguarda o servidor aceitar conexões (primeira execução cria o banco)
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8124/ 2>/dev/null; then
              break
            fi
            if ! kill -0 $SRV 2>/dev/null; then
              echo "servidor encerrou prematuramente"; cat /tmp/servidor.log; exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8124/api/config
          kill $SRV

      - name: Teste de permissões por papel (secretaria vs instrutor)
        run: python teste-permissoes.py

      - name: Sintaxe JavaScript (curso, exercícios, provas, QR Code)
        run: node --check curso.js && node --check exercicios.js && node --check provas.js && node --check qrcode.js
