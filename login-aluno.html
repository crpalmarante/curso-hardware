<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Curso de Informática</title>
<meta name="theme-color" content="#14b8a6">
<style>
:root{
  --primary:#14b8a6; --primary-hover:#0d9488; --primary-active:#0f766e;
  --secondary:#3B82F6; --danger:#EF4444; --success:#22C55E;
  --bg:linear-gradient(135deg,#06101f,#101b35,#151044);
  --text:#FFFFFF; --text-secondary:#DDDDDD; --text-muted:rgba(255,255,255,.5);
  --border:rgba(255,255,255,.14); --border-hover:rgba(255,255,255,.3);
  --surface:rgba(255,255,255,.06); --surface-hover:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.08);
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:24px;
  --font-family:"Inter","Segoe UI",Arial,sans-serif;
}
[data-theme="light"]{
  --bg:linear-gradient(135deg,#f0f4f8,#e2e8f0,#cbd5e1);
  --text:#1a202c; --text-secondary:#4a5568; --text-muted:rgba(0,0,0,.5);
  --border:rgba(0,0,0,.12); --border-hover:rgba(0,0,0,.25);
  --surface:rgba(255,255,255,.65); --surface-hover:rgba(255,255,255,.85);
  --glass:rgba(255,255,255,.7);
  --primary:#0f766e; --primary-hover:#0d5c55;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-family);background:var(--bg);color:var(--text);
  min-height:100vh;display:grid;place-items:center;padding:24px;
}
.login-card{
  width:100%;max-width:400px;background:var(--glass);border:1px solid var(--border);
  border-radius:var(--radius-xl);padding:36px;backdrop-filter:blur(20px);
  box-shadow:0 25px 60px rgba(0,0,0,.4);
}
.login-icon{
  width:56px;height:56px;border-radius:16px;margin:0 auto 18px;display:grid;place-items:center;
  font-size:26px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;
}
h1{text-align:center;font-size:19px;margin-bottom:6px}
p.sub{text-align:center;color:var(--text-secondary);font-size:13px;margin-bottom:26px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.field input{
  width:100%;padding:12px 14px;border-radius:var(--radius-md);font-size:14px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
}
.field input:focus{border-color:var(--primary);outline:none}
.btn{
  width:100%;margin-top:18px;padding:13px;border-radius:var(--radius-md);cursor:pointer;
  background:var(--primary);color:#fff;font-size:14.5px;font-weight:700;
  border:1px solid var(--primary);transition:background .2s;
}
.btn:hover{background:var(--primary-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.erro{
  display:none;margin-top:14px;padding:11px 14px;border-radius:var(--radius-md);
  background:rgba(239,68,68,.12);border:1px solid var(--danger);color:var(--danger);
  font-size:13px;text-align:center;
}
.erro.visible{display:block}
.aviso{
  display:none;margin-bottom:18px;padding:11px 14px;border-radius:var(--radius-md);
  background:rgba(245,158,11,.12);border:1px solid #f59e0b;color:#fbbf24;
  font-size:13px;text-align:center;line-height:1.45;
}
.aviso.visible{display:block}
.link-voltar{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--text-muted);text-decoration:none}
.link-voltar:hover{color:var(--text)}
.link-alt{display:block;text-align:center;margin-top:10px;font-size:12.5px;color:var(--text-muted);background:none;border:0;cursor:pointer;font-family:inherit}
.link-alt:hover{color:var(--text)}
.footer{text-align:center;margin-top:22px;font-size:11.5px;color:var(--text-muted)}
.hidden{display:none}
.login-card{max-width:440px}
.busca{margin-bottom:12px}
.lista-alunos{
  max-height:280px;overflow-y:auto;border:1px solid var(--border);
  border-radius:var(--radius-md);background:var(--surface);
}
.item-aluno{
  display:block;width:100%;text-align:left;padding:12px 14px;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:14px;
}
.item-aluno:last-child{border-bottom:0}
.item-aluno:hover{background:var(--surface-hover)}
.item-aluno b{display:block;font-size:14px}
.item-aluno small{display:block;margin-top:3px;color:var(--text-muted);font-size:12px}
.lista-vazia{padding:18px;text-align:center;color:var(--text-muted);font-size:13px}
.login-sugerido{
  margin-bottom:12px;padding:10px 12px;border-radius:var(--radius-md);
  background:rgba(20,184,166,.12);border:1px solid var(--primary);font-size:13px;line-height:1.45
}
.login-sugerido code{font-weight:700;color:var(--primary)}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-icon">👨‍🎓</div>
  <h1 id="titulo">Quem é você?</h1>
  <p class="sub" id="subtitulo">Escolha o seu nome na lista para entrar no curso.</p>

  <div class="aviso" id="aviso-troca">Este é o seu primeiro acesso. Escolha uma senha nova para continuar.</div>

  <div id="passo-lista">
    <div class="field busca">
      <label>Buscar na lista</label>
      <input type="search" id="busca-aluno" placeholder="Digite parte do nome..." autocomplete="off" autofocus>
    </div>
    <div class="lista-alunos" id="lista-alunos">
      <div class="lista-vazia">Carregando alunos...</div>
    </div>
    <div class="erro" id="erro-lista"></div>
  </div>

  <form id="login-form" class="hidden" autocomplete="off">
    <div class="login-sugerido" id="login-sugerido"></div>
    <div class="field">
      <label>Nome de login</label>
      <input type="text" id="login" placeholder="Ex.: maria.silva" autocomplete="username" spellcheck="false">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Senha padrão no primeiro acesso" autocomplete="current-password">
    </div>
    <button class="btn" type="submit" id="btn-entrar">Entrar no curso</button>
    <div class="erro" id="erro"></div>
    <button type="button" class="link-alt" id="btn-voltar-lista">◀ Voltar à lista de nomes</button>
  </form>

  <form id="troca-form" class="hidden" autocomplete="off">
    <div class="field">
      <label>Nova senha</label>
      <input type="password" id="senha-nova" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirme a nova senha</label>
      <input type="password" id="senha-confirma" placeholder="Repita a nova senha" autocomplete="new-password">
    </div>
    <button class="btn" type="submit" id="btn-trocar">Salvar senha e entrar</button>
    <div class="erro" id="erro-troca"></div>
  </form>

  <a class="link-voltar" href="index.html">◀ Voltar ao curso</a>
</div>

<div class="footer">
  Curso de Montagem e Manutenção de Computadores — acesso do aluno
</div>

<script>
const SENHA_ALUNO_MIN = 6;
let pendente = null; // { login, senha, nome }
let listaAlunos = [];

function sugerirLogin(nome){
  const mapa = {á:'a',à:'a',ã:'a',â:'a',ä:'a',é:'e',è:'e',ê:'e',ë:'e',í:'i',ì:'i',î:'i',ï:'i',ó:'o',ò:'o',õ:'o',ô:'o',ö:'o',ú:'u',ù:'u',û:'u',ü:'u',ç:'c',ñ:'n'};
  const n = String(nome||"").toLowerCase().split("").map(c => mapa[c] || c).join("");
  const parts = n.replace(/[^a-z0-9\s._-]/g," ").split(/\s+/).filter(p => p && ["da","de","do","das","dos","e"].indexOf(p) < 0);
  if (!parts.length) return "";
  if (parts.length === 1) return parts[0].slice(0, 32);
  return (parts[0] + "." + parts[parts.length - 1]).slice(0, 32);
}
function esc(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function mostrarErro(id, msg){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.toggle("visible", !!msg);
}
function entrarNoCurso(nome){
  window.location.href = "livro.html?aluno=" + encodeURIComponent(nome);
}
function loginDoAluno(a){
  return (a && a.login) ? a.login : sugerirLogin(a && a.nome);
}

function renderLista(){
  const q = (document.getElementById("busca-aluno").value || "").trim().toLowerCase();
  const el = document.getElementById("lista-alunos");
  const filtrada = listaAlunos.filter(a => {
    const blob = ((a.nome||"") + " " + (a.login||"") + " " + (a.turma||"") + " " + (a.matricula||"")).toLowerCase();
    return !q || blob.includes(q);
  });
  if (!listaAlunos.length){
    el.innerHTML = '<div class="lista-vazia">Nenhum aluno cadastrado ainda. Fale com o instrutor.</div>';
    return;
  }
  if (!filtrada.length){
    el.innerHTML = '<div class="lista-vazia">Nenhum nome corresponde à busca.</div>';
    return;
  }
  el.innerHTML = filtrada.map((a, i) => {
    const login = loginDoAluno(a);
    const extra = [a.matricula, a.turma].filter(Boolean).join(" · ");
    const selo = a.deve_trocar_senha || !a.tem_senha ? " · 1º acesso" : "";
    return `<button type="button" class="item-aluno" data-idx="${listaAlunos.indexOf(a)}">
      <b>${esc(a.nome)}</b>
      <small>Login: ${esc(login)}${extra?" · "+esc(extra):""}${selo}</small>
    </button>`;
  }).join("");
  el.querySelectorAll(".item-aluno").forEach(btn => {
    btn.addEventListener("click", () => escolherAluno(listaAlunos[Number(btn.dataset.idx)]));
  });
}

function escolherAluno(a){
  if (!a) return;
  if (!a.tem_senha){
    mostrarErro("erro-lista", "O instrutor ainda não definiu a senha padrão deste aluno. Peça o acesso no painel.");
    return;
  }
  const login = loginDoAluno(a);
  document.getElementById("login").value = login;
  document.getElementById("senha").value = "";
  document.getElementById("login-sugerido").innerHTML =
    "Olá, <b>" + esc(a.nome) + "</b>. Seu login sugerido é <code>" + esc(login) + "</code>."
    + (a.deve_trocar_senha ? " No primeiro acesso use a senha padrão e o sistema pede para trocá-la." : "");
  document.getElementById("passo-lista").classList.add("hidden");
  document.getElementById("login-form").classList.remove("hidden");
  document.getElementById("titulo").textContent = "Entrar no curso";
  document.getElementById("subtitulo").textContent = a.deve_trocar_senha
    ? "Primeiro acesso: senha padrão do instrutor, depois você troca."
    : "Use a senha que você definiu.";
  mostrarErro("erro", "");
  document.getElementById("senha").focus();
}

function voltarLista(){
  document.getElementById("login-form").classList.add("hidden");
  document.getElementById("troca-form").classList.add("hidden");
  document.getElementById("aviso-troca").classList.remove("visible");
  document.getElementById("passo-lista").classList.remove("hidden");
  document.getElementById("titulo").textContent = "Quem é você?";
  document.getElementById("subtitulo").textContent = "Escolha o seu nome na lista para entrar no curso.";
  document.getElementById("busca-aluno").focus();
}

function mostrarTroca(dados, senhaAtual){
  pendente = { login: dados.login, senha: senhaAtual, nome: dados.nome };
  document.getElementById("login-form").classList.add("hidden");
  document.getElementById("passo-lista").classList.add("hidden");
  document.getElementById("troca-form").classList.remove("hidden");
  document.getElementById("titulo").textContent = "Troque sua senha";
  document.getElementById("subtitulo").textContent = "Olá, " + dados.nome + ". Defina uma senha pessoal.";
  document.getElementById("aviso-troca").classList.add("visible");
  document.getElementById("senha-nova").focus();
}

async function carregarLista(){
  try {
    const r = await fetch("api/alunos-login");
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || "falha");
    listaAlunos = Array.isArray(j.alunos) ? j.alunos : [];
    renderLista();
  } catch (err) {
    document.getElementById("lista-alunos").innerHTML =
      '<div class="lista-vazia">Não foi possível carregar a lista. Confira se o servidor está no ar.</div>';
  }
}

document.getElementById("busca-aluno").addEventListener("input", renderLista);
document.getElementById("btn-voltar-lista").addEventListener("click", voltarLista);

document.getElementById("login-form").addEventListener("submit", async function(e){
  e.preventDefault();
  const login = document.getElementById("login").value.trim();
  const senha = document.getElementById("senha").value;
  mostrarErro("erro", "");
  if (!login || !senha) {
    mostrarErro("erro", "Informe o login e a senha.");
    return;
  }
  const btn = document.getElementById("btn-entrar");
  btn.disabled = true;
  btn.textContent = "Entrando...";
  try {
    const r = await fetch("api/login-aluno", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login, senha })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      mostrarErro("erro", j.erro || "Login ou senha incorretos.");
      btn.disabled = false;
      btn.textContent = "Entrar no curso";
      document.getElementById("senha").value = "";
      document.getElementById("senha").focus();
      return;
    }
    if (j.deve_trocar_senha) {
      mostrarTroca(j, senha);
      return;
    }
    entrarNoCurso(j.nome);
  } catch (err) {
    mostrarErro("erro", "Não foi possível conectar ao servidor.");
    btn.disabled = false;
    btn.textContent = "Entrar no curso";
  }
});

document.getElementById("troca-form").addEventListener("submit", async function(e){
  e.preventDefault();
  if (!pendente) return;
  const nova = document.getElementById("senha-nova").value;
  const conf = document.getElementById("senha-confirma").value;
  mostrarErro("erro-troca", "");
  if (!nova || nova.length < SENHA_ALUNO_MIN) {
    mostrarErro("erro-troca", "A nova senha deve ter ao menos " + SENHA_ALUNO_MIN + " caracteres.");
    return;
  }
  if (nova !== conf) {
    mostrarErro("erro-troca", "As senhas não conferem.");
    return;
  }
  if (nova === pendente.senha) {
    mostrarErro("erro-troca", "Escolha uma senha diferente da senha padrão.");
    return;
  }
  const btn = document.getElementById("btn-trocar");
  btn.disabled = true;
  btn.textContent = "Salvando...";
  try {
    const r = await fetch("api/aluno-trocar-senha", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        login: pendente.login,
        senha_atual: pendente.senha,
        senha_nova: nova
      })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      mostrarErro("erro-troca", j.erro || "Não foi possível trocar a senha.");
      btn.disabled = false;
      btn.textContent = "Salvar senha e entrar";
      return;
    }
    entrarNoCurso(pendente.nome);
  } catch (err) {
    mostrarErro("erro-troca", "Não foi possível conectar ao servidor.");
    btn.disabled = false;
    btn.textContent = "Salvar senha e entrar";
  }
});

carregarLista();
</script>
</body>
</html>
