<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Aulas — Montagem e Manutenção de Computadores</title>
<style>
:root{
  --prim:#0f766e; --sec:#3B82F6; --ink:#1a202c; --mut:#4a5568;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:#e2e8f0;
  line-height:1.5;
}
.toolbar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;background:#0f172a;color:#fff;
}
.toolbar h1{font-size:16px;font-weight:700}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.toolbar button{
  padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;
  background:var(--prim);color:#fff;border:1px solid var(--prim);
}
.toolbar button:hover{filter:brightness(1.1)}
.toolbar button.ghost{background:transparent;border-color:#475569;color:#cbd5e1}
.toolbar label{font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:6px}
.toolbar select{background:#1e293b;color:#fff;border:1px solid #475569;border-radius:6px;padding:6px 8px;font-size:13px}
.page{
  width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:14mm 16mm;
  box-shadow:0 4px 20px rgba(0,0,0,.2);page-break-after:always;position:relative;
}
.page:last-child{page-break-after:auto}
.page-print-head{text-align:center;margin-bottom:8mm;border-bottom:2px solid var(--prim);padding-bottom:4mm}
.page-print-head h2{font-size:20px;color:var(--prim);letter-spacing:.5px}
.page-print-head .sub{font-size:12px;color:var(--mut)}
.plano-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:5mm 0}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4mm 0}
.info-box{border:1px solid #cbd5e0;border-radius:8px;padding:8px 10px;text-align:center;background:#f8fafc}
.info-box .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.info-box .val{font-size:13px;font-weight:700;color:var(--prim)}
.secao{margin:5mm 0}
.secao h4{
  font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--prim);
  border-left:4px solid var(--prim);padding-left:8px;margin-bottom:3mm;
}
.secao p, .secao ul{font-size:12.5px}
.secao ul{padding-left:6mm}
.secao li{margin:1mm 0}
.badge{
  display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;
}
.badge.teoria{background:#64748b}
.badge.mista{background:#f59e0b}
.badge.pratica{background:#0d9488}
.campo{border:1px dashed #94a3b8;border-radius:8px;padding:8px 10px;min-height:22px;color:var(--mut);font-size:12px}
.campo.altura{min-height:14mm}
.campo-grande{min-height:20mm}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linha-preenchimento{border-bottom:1px solid #94a3b8;height:7mm}
.rodape{
  position:absolute;bottom:8mm;left:16mm;right:16mm;
  display:flex;justify-content:space-between;align-items:flex-end;
  font-size:10px;color:var(--mut);border-top:1px solid #e2e8f0;padding-top:3mm;
}
.rodape .ass{
  text-align:center;width:70mm;border-top:1px solid #64748b;padding-top:2mm;margin-top:8mm;
}
.rodape .ass span{display:block;font-size:11px;font-weight:700;color:var(--ink)}
.checks-checklist{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12px}
.checks-checklist label{display:flex;align-items:center;gap:6px}
.checks-checklist input{margin:0}
.checkmark{width:5mm;height:5mm;border:1px solid #94a3b8;border-radius:3px;display:inline-block;flex-shrink:0}
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .page{box-shadow:none;margin:0}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>

<div class="toolbar">
  <h1>📋 Plano de Aulas — Montagem e Manutenção de Computadores</h1>
  <div class="right">
    <label>Módulo:
      <select id="filtro-mod">
        <option value="">Todos</option>
      </select>
    </label>
    <button onclick="imprimir()">🖨️ Imprimir / PDF</button>
  </div>
</div>

<div id="conteudo"></div>

<script src="curso.js"></script>
<script src="exercicios.js"></script>
<script src="provas.js"></script>
<script>
const VOLUMES = {
  "01":"Volume 1 — Fundamentos da Informática",
  "02":"Volume 2 — Hardware",
  "03":"Volume 3 — Montagem",
  "04":"Volume 4 — Instalação",
  "05":"Volume 5 — Manutenção",
  "06":"Volume 6 — Diagnóstico",
  "07":"Volume 7 — Laboratório",
  "08":"Volume 8 — Atendimento Técnico"
};
const METODOLOGIA = "15 min revisão · 35 min teoria · 60 min prática · 10 min revisão final";

/* ===== AULAS EXTRAS — APÊNDICES (armazenamento) =====
   Páginas de plano de aula para os 2 apêndices do livro.
   São aulas suplementares: vêm depois das 43 aulas regulares. */
const APENDICES = [
  {
    ap: "A", titulo: "Apêndice A — Adicionando um novo disco no Windows (Diskpart)",
    obj: "Particionar, formatar e atribuir letra a um disco novo no Windows usando o Diskpart, sem apagar dados por engano.",
    conteudo: [
      "O que é o Diskpart e como abri-lo como administrador",
      "list disk e select disk — identificando o disco certo",
      "clean, create partition primary, format fs=ntfs quick e assign",
      "Conversão para GPT em discos acima de 2 TB (convert gpt)",
      "Erros comuns e boas práticas de segurança"
    ],
    pratica: "Em um computador de teste ou máquina virtual, adicione um disco virtual vazio e faça o procedimento completo no Diskpart: listar, selecionar, limpar, criar partição, formatar em NTFS e atribuir a letra E. Depois repita em um disco pequeno convertendo para GPT.",
    exercicios: "Quiz interativo (9 objetivas + 1 dissertativa) na página de Exercícios dos Apêndices + questões do Apêndice A do livro (seção 7)",
    materiais: "Computador de teste / VM com disco extra vazio · Windows · acesso ao Diskpart · apostila (Apêndice A)"
  },
  {
    ap: "B", titulo: "Apêndice B — Adicionando um novo disco no Linux (GParted e Fdisk)",
    obj: "Particionar, formatar e montar um disco novo no Linux pela linha de comando (fdisk) e pela interface gráfica (GParted), com montagem permanente no /etc/fstab.",
    conteudo: [
      "Identificando o disco no Linux: lsblk, fdisk -l e /dev/sdX",
      "Particionando com o fdisk: g, n, w — tabela GPT e partição",
      "Formatando: mkfs.ext4, mkfs.ntfs e mkfs.exfat",
      "Particionando com o GParted (gráfico): criar tabela, nova partição, aplicar",
      "Montagem manual (mount) e permanente no /etc/fstab com UUID"
    ],
    pratica: "Em uma máquina virtual Linux, adicione um disco virtual de 2 GB e repita o procedimento com o fdisk (GPT + ext4) e com o GParted (NTFS). Monte em /mnt/disco2, crie um arquivo de teste, configure o fstab com o UUID e reinicie para confirmar a montagem automática.",
    exercicios: "Quiz interativo (11 objetivas + 1 dissertativa) na página de Exercícios dos Apêndices + questões do Apêndice B do livro (seção 7)",
    materiais: "Máquina virtual Linux com disco extra vazio · pacotes fdisk e gparted · terminal · apostila (Apêndice B)"
  }
];

function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function badge(tipo){
  const nomes = { teoria:"Teoria", mista:"Mista", pratica:"Prática" };
  return `<span class="badge ${tipo}">${nomes[tipo]||tipo}</span>`;
}
function exerciciosDaAula(id){
  const qs = (EXERCICIOS||{})[id] || [];
  const obj = qs.filter(q=>q.tipo!=="disc").length;
  const disc = qs.filter(q=>q.tipo==="disc").length;
  if (!obj && !disc) return "—";
  return obj + " objetivas" + (disc ? " + " + disc + " dissertativa" : "");
}
function provaDoModulo(mod){
  const p = (PROVAS||{})[mod];
  return p ? p.titulo : "—";
}
function planoAula(m, a, semanaGlobal){
  const id = m.num + "|" + a.t;
  return `
  <div class="page">
    <div class="page-print-head">
      <h2>PLANO DE AULA</h2>
      <div class="sub">Curso de Montagem e Manutenção de Computadores · Estrutura programática</div>
    </div>

    <div class="plano-head">
      <div style="font-size:16px;font-weight:800;color:var(--ink)">Módulo ${m.num} — ${esc(m.titulo)}</div>
      <div style="font-size:13px;font-weight:700;color:var(--prim)">Aula: ${esc(a.t)}</div>
    </div>

    <div class="info-grid">
      <div class="info-box"><div class="lab">Semana</div><div class="val">${semanaGlobal}ª</div></div>
      <div class="info-box"><div class="lab">Tipo</div><div class="val">${badge(a.tipo)}</div></div>
      <div class="info-box"><div class="lab">Carga</div><div class="val">2 horas</div></div>
      <div class="info-box"><div class="lab">Livro</div><div class="val" style="font-size:11px">${VOLUMES[m.num]||"Volume "+m.num}</div></div>
    </div>

    <div class="secao">
      <h4>🎯 Objetivo</h4>
      <p><b>${esc(a.obj)}</b></p>
    </div>

    <div class="secao">
      <h4>📘 Conteúdo</h4>
      <ul>${a.conteudo.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    </div>

    <div class="secao">
      <h4>🔧 Atividade prática</h4>
      <p>${esc(a.pratica)}</p>
    </div>

    <div class="secao">
      <h4>✅ Exercícios / avaliação da aula</h4>
      <p>Caderno: <b>${exerciciosDaAula(id)}</b> &nbsp;·&nbsp; Prova do módulo: <b>${esc(provaDoModulo(m.num))}</b></p>
    </div>

    <div class="secao">
      <h4>⏱️ Desenvolvimento (metodologia)</h4>
      <p style="font-size:12px"><b>${METODOLOGIA}</b></p>
      <div class="row2" style="margin-top:2mm">
        <div class="campo altura" style="font-weight:600">1. Abertura / revisão da aula anterior</div>
        <div class="campo altura" style="font-weight:600">2. Teoria (exposição dialogada)</div>
        <div class="campo altura" style="font-weight:600">3. Demonstração / prática guiada</div>
        <div class="campo altura" style="font-weight:600">4. Prática dos alunos + checkout</div>
        <div class="campo altura" style="font-weight:600">5. Correção / fechamento</div>
        <div class="campo altura" style="font-weight:600">6. Registro de presença e encaminhamentos</div>
      </div>
    </div>

    <div class="secao">
      <h4>🧰 Materiais e equipamentos</h4>
      <div class="campo-grande campo"></div>
    </div>

    <div class="secao">
      <h4>📝 Observações do instrutor</h4>
      <div class="campo-grande campo"></div>
    </div>

    <div class="rodape">
      <div style="font-size:10px">
        <b>${esc(a.t)}</b> · Semana ${semanaGlobal} · Módulo ${m.num} · ${VOLUMES[m.num]}
      </div>
      <div class="ass"><span>Assinatura do instrutor</span></div>
    </div>
  </div>`;
}
function planoApendice(apd, semanaGlobal){
  return `
  <div class="page">
    <div class="page-print-head">
      <h2>PLANO DE AULA</h2>
      <div class="sub">Curso de Montagem e Manutenção de Computadores · Aula extra (apêndice)</div>
    </div>

    <div class="plano-head">
      <div style="font-size:16px;font-weight:800;color:var(--ink)">📎 ${esc(apd.titulo)}</div>
      <div style="font-size:13px;font-weight:700;color:var(--prim)">Aula extra de armazenamento</div>
    </div>

    <div class="info-grid">
      <div class="info-box"><div class="lab">Semana</div><div class="val">${semanaGlobal}ª</div></div>
      <div class="info-box"><div class="lab">Tipo</div><div class="val">${badge("pratica")}</div></div>
      <div class="info-box"><div class="lab">Carga</div><div class="val">2 horas</div></div>
      <div class="info-box"><div class="lab">Livro</div><div class="val" style="font-size:11px">Apêndice ${apd.ap}</div></div>
    </div>

    <div class="secao">
      <h4>🎯 Objetivo</h4>
      <p><b>${esc(apd.obj)}</b></p>
    </div>

    <div class="secao">
      <h4>📘 Conteúdo</h4>
      <ul>${apd.conteudo.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    </div>

    <div class="secao">
      <h4>🔧 Atividade prática</h4>
      <p>${esc(apd.pratica)}</p>
    </div>

    <div class="secao">
      <h4>✅ Exercícios / avaliação da aula</h4>
      <p>${esc(apd.exercicios)}</p>
    </div>

    <div class="secao">
      <h4>⏱️ Desenvolvimento (metodologia)</h4>
      <p style="font-size:12px"><b>${METODOLOGIA}</b></p>
      <div class="row2" style="margin-top:2mm">
        <div class="campo altura" style="font-weight:600">1. Abertura / revisão da aula anterior</div>
        <div class="campo altura" style="font-weight:600">2. Teoria (exposição dialogada)</div>
        <div class="campo altura" style="font-weight:600">3. Demonstração / prática guiada</div>
        <div class="campo altura" style="font-weight:600">4. Prática dos alunos + checkout</div>
        <div class="campo altura" style="font-weight:600">5. Correção / fechamento</div>
        <div class="campo altura" style="font-weight:600">6. Registro de presença e encaminhamentos</div>
      </div>
    </div>

    <div class="secao">
      <h4>🧰 Materiais e equipamentos</h4>
      <p style="font-size:12px">${esc(apd.materiais)}</p>
    </div>

    <div class="secao">
      <h4>📝 Observações do instrutor</h4>
      <div class="campo-grande campo"></div>
    </div>

    <div class="rodape">
      <div style="font-size:10px">
        <b>${esc(apd.titulo)}</b> · Semana ${semanaGlobal} · Aula extra
      </div>
      <div class="ass"><span>Assinatura do instrutor</span></div>
    </div>
  </div>`;
}
function render(){
  const filtro = document.getElementById("filtro-mod").value;
  const container = document.getElementById("conteudo");
  let semanaGlobal = 0;
  const pages = [];
  for (const m of CURSO){
    if (filtro && m.num !== filtro) { continue; }
    for (const a of m.aulas){
      semanaGlobal++;
      pages.push(planoAula(m, a, semanaGlobal));
    }
  }
  // aulas extras (apêndices) — depois das aulas regulares, mantendo as semanas reais do curso
  if (!filtro || filtro === "AP"){
    if (filtro === "AP"){
      // no filtro isolado dos apêndices, continua da semana 44 (43 aulas + 1)
      semanaGlobal = CURSO.reduce((n, m) => n + m.aulas.length, 0);
    }
    for (const apd of APENDICES){
      semanaGlobal++;
      pages.push(planoApendice(apd, semanaGlobal));
    }
  }
  container.innerHTML = pages.join("");
  if (pages.length === 0) container.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b">Nenhuma aula encontrada para este módulo.</div>';
}
function preencherModulos(){
  const sel = document.getElementById("filtro-mod");
  for (const m of CURSO){
    const opt = document.createElement("option");
    opt.value = m.num;
    opt.textContent = "Módulo " + m.num + " — " + m.titulo;
    sel.appendChild(opt);
  }
  const optAp = document.createElement("option");
  optAp.value = "AP";
  optAp.textContent = "📎 Apêndices (aulas extras de armazenamento)";
  sel.appendChild(optAp);
}
function imprimir(){
  window.print();
}
preencherModulos();
document.getElementById("filtro-mod").addEventListener("change", render);
render();
</script>
<script>
/* Proteção suave: se houver servidor e ele exigir login, redireciona.
   (Sem servidor — modo local / GitHub Pages — a página segue liberada.) */
(async function(){
  try {
    const ctl = new AbortController();
    setTimeout(()=>ctl.abort(), 2500);
    const r = await fetch("api/alunos", { signal: ctl.signal });
    if (r.status === 401) window.location.href = "login-alunos.html";
  } catch(e) { /* sem servidor: liberado */ }
})();
</script>
</body>
</html>
