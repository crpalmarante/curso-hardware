<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar Certificado</title>
<style>
:root{--prim:#0f766e;--gold:#c9a227;--danger:#EF4444;--success:#22C55E}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#06101f,#101b35,#151044);
  color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px;
}
.card{
  width:100%;max-width:520px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:20px;padding:36px;backdrop-filter:blur(20px);text-align:center;
}
.icon{
  width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  font-size:30px;
}
.icon.valido{background:rgba(34,197,94,.15);border:2px solid var(--success)}
.icon.invalido{background:rgba(239,68,68,.15);border:2px solid var(--danger)}
.icon.carregando{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)}
h1{font-size:20px;margin-bottom:6px}
.sub{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:24px}
.badge-valido{
  display:inline-block;padding:8px 20px;border-radius:999px;font-weight:800;font-size:15px;
  background:rgba(34,197,94,.15);border:1px solid var(--success);color:var(--success);
  margin:10px 0 20px;
}
.badge-invalido{
  display:inline-block;padding:8px 20px;border-radius:999px;font-weight:800;font-size:15px;
  background:rgba(239,68,68,.15);border:1px solid var(--danger);color:var(--danger);
  margin:10px 0 20px;
}
.info{text-align:left;border-top:1px solid rgba(255,255,255,.12);padding-top:16px;margin-top:8px}
.info .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px}
.info .row b{color:var(--gold)}
.info .row span{color:rgba(255,255,255,.85);text-align:right}
.codigo-chip{
  display:inline-block;margin-top:16px;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.08);font-size:12px;color:var(--gold);letter-spacing:1px;
}
.rodape{margin-top:24px;font-size:11px;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<div class="card">
  <div class="icon carregando" id="icone">🔍</div>
  <h1>Verificação de Certificado</h1>
  <div class="sub" id="status">Consultando o código informado...</div>
  <div id="resultado"></div>
  <div class="codigo-chip" id="chip" style="display:none"></div>
  <div class="rodape">Emissão autenticada pelo sistema do Curso de Montagem e Manutenção de Computadores</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const codigo = (params.get("codigo") || "").trim();
async function verificar(){
  const chip = document.getElementById("chip");
  const status = document.getElementById("status");
  const icone = document.getElementById("icone");
  const res = document.getElementById("resultado");
  if (!codigo){
    status.textContent = "Nenhum código informado.";
    status.innerHTML = 'Informe o código na URL: <b>verificar-certificado.html?codigo=XXXX</b>';
    return;
  }
  chip.style.display = "inline-block";
  chip.textContent = "Código: " + codigo;
  try {
    const r = await fetch("api/verificar-certificado?codigo=" + encodeURIComponent(codigo));
    const j = await r.json();
    if (j.valido){
      icone.className = "icon valido"; icone.textContent = "✅";
      status.textContent = "Certificado autêntico";
      status.style.color = "var(--success)";
      res.innerHTML = `
        <div class="badge-valido">CERTIFICADO VÁLIDO</div>
        <div class="info">
          <div class="row"><b>Aluno(a)</b><span>${esc(j.nome)}</span></div>
          <div class="row"><b>Curso</b><span>Montagem e Manutenção de Computadores</span></div>
          ${j.turma ? `<div class="row"><b>Turma</b><span>${esc(j.turma)}</span></div>` : ""}
          <div class="row"><b>Nota final</b><span>${j.nota_final != null ? j.nota_final + " / 10" : "—"}</span></div>
          <div class="row"><b>Frequência</b><span>${j.frequencia != null ? j.frequencia + "%" : "—"}</span></div>
          <div class="row"><b>Emitido em</b><span>${fmt(j.emitido_em)}</span></div>
        </div>`;
    } else {
      icone.className = "icon invalido"; icone.textContent = "❌";
      status.textContent = "Certificado não encontrado";
      status.style.color = "var(--danger)";
      res.innerHTML = `<div class="badge-invalido">CERTIFICADO INVÁLIDO OU INEXISTENTE</div>
        <div class="info" style="font-size:13px;color:rgba(255,255,255,.75)">O código informado não corresponde a nenhum certificado emitido por este sistema. Desconfie de documentos com este código e entre em contato com a coordenação.</div>`;
    }
  } catch(e){
    icone.className = "icon invalido"; icone.textContent = "⚠️";
    status.textContent = "Erro ao consultar a verificação";
    status.style.color = "var(--danger)";
  }
}
function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(d){ return new Date(d).toLocaleDateString("pt-BR"); }
verificar();
</script>
</body>
</html>
